<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TCHB DISPO OPS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta name="theme-color" content="#f7f7f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // The saved theme before anything is drawn (no flash): light / dark as chosen, otherwise the device's.
    (function () { var t = null; try { t = localStorage.getItem('tchb_theme'); } catch (e) {}
      document.documentElement.dataset.theme = t || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="js/app.js">
</head>
<body>
  <div id="aurora" class="aurora" aria-hidden="true"></div>
  <div id="boot" class="boot" role="status"><img src="assets/logo-mark.png" alt=""><b>DISPO <span>OPS</span></b><small>Loading…</small></div>
  <header id="header" class="header"></header>
  <main id="main" class="main"></main>
  <button type="button" id="chatFab" class="chat-fab" data-act="chatToggle" aria-label="Property discussions" hidden></button>
  <section id="chat" class="chat" aria-label="Property discussions" hidden></section>
  <nav id="bottomNav" class="bottom-nav" aria-label="Screens" hidden></nav>
  <div id="layer" hidden></div>
  <div id="modal" hidden></div>
  <noscript><p style="padding:24px;font-family:sans-serif">DISPO OPS needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
